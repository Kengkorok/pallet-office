<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pallet Office Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <div id="office"></div>
  <div class="topbar">
    <h1>PALLET OFFICE · DEMO</h1>
    <button id="music" type="button" aria-pressed="false">♪ Muzik</button>
    <input id="volume" type="range" min="0" max="0.6" step="0.05" value="0.15" aria-label="Volume muzik" title="Volume muzik">
    <button id="full" type="button">⛶ Skrin penuh</button>
    <a class="btn" id="back" href="./">← Live</a>
  </div>
  <section class="panel" id="team-panel">
    <h2>Team <span id="team-summary"></span></h2>
    <ul id="team"></ul>
  </section>
  <section class="panel" id="feed-panel">
    <h2>Aktiviti</h2>
    <ul id="feed"></ul>
  </section>
  <script src="office.js"></script>
  <script src="sim.js"></script>
  <script src="music.js"></script>
  <script>
    // Endless generated workday: no server events, no recording.
    const $ = (id) => document.getElementById(id);
    const office = PalletOffice.createOffice($('office'), { feed: $('feed'), team: { list: $('team'), summary: $('team-summary') } });
    PalletSim.start(office);
    $('full').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
  </script>
</body>
</html>
