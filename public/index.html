<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pallet Office</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='8' fill='%23e04848'/><rect y='8' width='16' height='8' fill='%23fff'/><rect y='7' width='16' height='2' fill='%23222'/><rect x='6' y='6' width='4' height='4' fill='%23222'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <header>
    <h1>PALLET OFFICE</h1>
    <span class="live" id="live">menyambung…</span>
    <div class="stats">
      <span><b id="s-total">0</b> dalam ofis</span>
      <span><b id="s-working">0</b> tengah kerja</span>
      <span class="alert"><b id="s-waiting">0</b> perlukan kau</span>
    </div>
    <div class="tools">
      <button id="rec" type="button">⏺ Rakam</button>
      <a class="btn" href="replay.html">▶ Replay</a>
    </div>
  </header>
  <main>
    <div id="office"></div>
    <aside>
      <h2>AKTIVITI</h2>
      <ul id="feed"></ul>
    </aside>
  </main>
  <footer>Sprite dimuat dari <a href="https://github.com/PokeAPI/sprites">PokeAPI/sprites</a>. Pokémon © Nintendo / Game Freak — projek hobi, bukan rasmi.</footer>
  <script src="office.js"></script>
  <script src="live.js"></script>
</body>
</html>
