<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pallet Office Replay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <div id="office"></div>
  <div class="topbar">
    <h1>PALLET OFFICE · REPLAY</h1>
    <span class="btn" id="pos">–</span>
    <select id="file" aria-label="Rakaman"></select>
    <select id="speed" aria-label="Laju">
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <button id="play" type="button">▶ Main</button>
    <button id="restart" type="button">⟲ Ulang</button>
    <button id="music" type="button" aria-pressed="false">♪ Muzik</button>
    <input id="volume" type="range" min="0" max="0.6" step="0.05" value="0.15" aria-label="Volume muzik" title="Volume muzik">
    <button id="full" type="button">⛶ Skrin penuh</button>
    <a class="btn" id="back" href="./">← Live</a>
  </div>
  <section class="panel" id="team-panel">
    <h2>Team <span id="team-summary"></span></h2>
    <ul id="team"></ul>
  </section>
  <section class="panel" id="feed-panel">
    <h2>Aktiviti</h2>
    <ul id="feed"></ul>
  </section>
  <script src="office.js"></script>
  <script src="replay.js"></script>
  <script src="music.js"></script>
</body>
</html>
